# Development docker-compose
# This shows how to use http2cli with Alpine (which has cat, date, rev)

services:
  http2cli:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./configs:/etc/http2cli:ro
    environment:
      - HTTP2CLI_SERVER_PORT=8080
    # Security hardening
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
